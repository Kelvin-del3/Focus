<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f6fa;
    color: #202333;
    padding-bottom: 100px;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 25px 20px;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: #5b61e8;
}

.profile {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    background: #e4e5ff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5b61e8;
    font-weight: bold;
}

/* GREETING */

.greeting {
    margin-bottom: 25px;
}

.greeting h1 {
    font-size: 27px;
    margin-bottom: 8px;
}

.greeting p {
    color: #85899a;
    font-size: 14px;
}

/* PROGRESS */

.progress-card {
    background: #5b61e8;
    color: white;
    padding: 24px;
    border-radius: 20px;
    margin-bottom: 30px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.progress-top h3 {
    font-size: 16px;
}

.progress-number {
    font-size: 25px;
    font-weight: bold;
}

.progress-bar {
    height: 8px;
    background: rgba(255,255,255,.25);
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: white;
    border-radius: 20px;
    transition: .3s;
}

.progress-info {
    font-size: 12px;
    margin-top: 12px;
    opacity: .85;
}

/* TASKS */

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 17px;
}

.section-header h2 {
    font-size: 19px;
}

.add-btn {
    background: #5b61e8;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 15px;
    font-weight: bold;
    cursor: pointer;
}

.task-form {
    display: none;
    gap: 8px;
    margin-bottom: 20px;
}

.task-form input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #e1e2eb;
    border-radius: 10px;
    outline: none;
    background: white;
}

.task-form button {
    background: #5b61e8;
    color: white;
    border: none;
    padding: 0 15px;
    border-radius: 10px;
    cursor: pointer;
}

.task {
    background: white;
    padding: 17px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.025);
}

.task input {
    width: 19px;
    height: 19px;
    accent-color: #5b61e8;
}

.task-content {
    flex: 1;
}

.task-content h4 {
    font-size: 14px;
    margin-bottom: 5px;
}

.task-content p {
    color: #999dad;
    font-size: 12px;
}

.task.done h4 {
    text-decoration: line-through;
    color: #a3a5b1;
}

.delete {
    border: none;
    background: transparent;
    color: #b0b2bf;
    font-size: 19px;
    cursor: pointer;
}

/* BOTTOM NAV */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    display: flex;
    justify-content: space-around;
    padding: 15px 5px 20px;
    border-top: 1px solid #eeeef2;
}

.nav-item {
    color: #a0a3b1;
    font-size: 11px;
    text-align: center;
    cursor: pointer;
}

.nav-item span {
    display: block;
    font-size: 20px;
    margin-bottom: 5px;
}

.nav-item.active {
    color: #5b61e8;
    font-weight: bold;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #999;
    font-size: 14px;
}

/* DARK MODE */

@media (prefers-color-scheme: dark) {
    body {
        background: #171923;
        color: white;
    }

    .task, .bottom-nav {
        background: #222533;
    }

    .task-form input {
        background: #222533;
        color: white;
        border-color: #383b4b;
    }

    .task-content p {
        color: #999;
    }

    .bottom-nav {
        border-color: #333;
    }
}
</style>
</head>

<body>

<div class="container">

    <header>
        <div class="logo">Focus.</div>
        <div class="profile">U</div>
    </header>

    <section class="greeting">
        <h1 id="greeting">Olá!</h1>
        <p id="date"></p>
    </section>

    <section class="progress-card">

        <div class="progress-top">
            <h3>O teu progresso</h3>
            <div class="progress-number" id="percentage">0%</div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <p class="progress-info" id="progress-info">
            Começa a concluir as tuas tarefas!
        </p>

    </section>

    <section>

        <div class="section-header">
            <h2>Minhas tarefas</h2>
            <button class="add-btn" onclick="toggleForm()">
                + Adicionar
            </button>
        </div>

        <div class="task-form" id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Nome da tarefa..."
            >
            <button onclick="addTask()">Adicionar</button>
        </div>

        <div id="task-list"></div>

    </section>

</div>

<nav class="bottom-nav">

    <div class="nav-item active">
        <span>⌂</span>
        Início
    </div>

    <div class="nav-item">
        <span>▤</span>
        Tarefas
    </div>

    <div class="nav-item">
        <span>◷</span>
        Foco
    </div>

    <div class="nav-item">
        <span>⚙</span>
        Definições
    </div>

</nav>

<script>

// DATA

const today = new Date();

document.getElementById("date").textContent =
    today.toLocaleDateString("pt-PT", {
        weekday: "long",
        day: "numeric",
        month: "long"
    });

const hour = today.getHours();

document.getElementById("greeting").textContent =
    hour < 12 ? "Bom dia!" :
    hour < 18 ? "Boa tarde!" : "Boa noite!";

// STORAGE

let tasks = JSON.parse(
    localStorage.getItem("focus_tasks")
) || [
    { name: "Estudar programação", done: false },
    { name: "Fazer exercício físico", done: false },
    { name: "Ler durante 20 minutos", done: true }
];

// RENDER TASKS

function renderTasks() {

    const list = document.getElementById("task-list");

    list.innerHTML = "";

    if (tasks.length === 0) {
        list.innerHTML =
            '<div class="empty">Ainda não tens tarefas.</div>';
    }

    tasks.forEach((task, index) => {

        const div = document.createElement("div");

        div.className = task.done ? "task done" : "task";

        div.innerHTML = `
            <input
                type="checkbox"
                ${task.done ? "checked" : ""}
                onchange="toggleTask(${index})"
            >

            <div class="task-content">
                <h4></h4>
                <p>${task.done ? "Concluída" : "Pendente"}</p>
            </div>

            <button class="delete"
                onclick="deleteTask(${index})">×</button>
        `;

        div.querySelector("h4").textContent = task.name;

        list.appendChild(div);

    });

    updateProgress();

    localStorage.setItem(
        "focus_tasks",
        JSON.stringify(tasks)
    );
}

// ADD TASK

function toggleForm() {

    const form = document.getElementById("task-form");

    form.style.display =
        form.style.display === "flex" ? "none" : "flex";

}

function addTask() {

    const input = document.getElementById("task-input");

    const name = input.value.trim();

    if (!name) return;

    tasks.push({
        name: name,
        done: false
    });

    input.value = "";

    renderTasks();

}

// COMPLETE TASK

function toggleTask(index) {

    tasks[index].done = !tasks[index].done;

    renderTasks();

}

// DELETE TASK

function deleteTask(index) {

    tasks.splice(index, 1);

    renderTasks();

}

// UPDATE PROGRESS

function updateProgress() {

    const total = tasks.length;

    const completed = tasks.filter(t => t.done).length;

    const percentage = total
        ? Math.round((completed / total) * 100)
        : 0;

    document.getElementById("percentage")
        .textContent = percentage + "%";

    document.getElementById("progress")
        .style.width = percentage + "%";

    document.getElementById("progress-info")
        .textContent =
        `${completed} de ${total} tarefas concluídas`;

}

// INITIALIZE

renderTasks();

</script>

</body>
</html>
