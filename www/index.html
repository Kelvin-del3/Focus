<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Moçambique 🇲🇿</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0F172A;
    color: white;
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    margin: auto;
    padding: 25px 20px;
}

header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
}

.logo {
    width: 48px;
    height: 48px;
    background: #1E293B;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 25px;
}

header h2 {
    font-size: 18px;
}

header p {
    color: #94A3B8;
    font-size: 12px;
    margin-top: 4px;
}

.escondido {
    display: none !important;
}

/* INÍCIO */

.hero {
    padding-top: 30px;
}

.badge {
    display: inline-block;
    background: #172554;
    color: #60A5FA;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.hero h1 {
    font-size: 34px;
    line-height: 1.2;
    margin: 22px 0 15px;
}

.hero p {
    color: #94A3B8;
    line-height: 1.7;
    font-size: 14px;
}

.recorde {
    margin: 30px 0;
    background: #1E293B;
    padding: 18px;
    border-radius: 14px;
    display: flex;
    justify-content: space-between;
}

.recorde strong {
    color: #FACC15;
}

label {
    display: block;
    margin-bottom: 10px;
    font-size: 13px;
    color: #CBD5E1;
}

select {
    width: 100%;
    padding: 15px;
    background: #1E293B;
    border: 1px solid #334155;
    border-radius: 12px;
    color: white;
    font-size: 14px;
    outline: none;
    margin-bottom: 20px;
}

button {
    cursor: pointer;
    border: none;
    font-size: 15px;
}

.btn-principal {
    width: 100%;
    padding: 17px;
    border-radius: 12px;
    background: #2563EB;
    color: white;
    font-weight: bold;
    transition: 0.2s;
}

.btn-principal:active {
    transform: scale(0.97);
}

/* JOGO */

.info-jogo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #CBD5E1;
    font-size: 14px;
    margin-bottom: 15px;
}

.tempo {
    background: #1E293B;
    padding: 10px 15px;
    border-radius: 10px;
    color: #FACC15;
}

.progresso {
    width: 100%;
    height: 7px;
    background: #334155;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 30px;
}

#barra {
    height: 100%;
    width: 0%;
    background: #3B82F6;
    transition: 0.3s;
}

.cartao-pergunta {
    background: #1E293B;
    padding: 22px;
    border-radius: 18px;
}

.categoria-tag {
    color: #60A5FA;
    font-size: 12px;
    font-weight: bold;
}

.cartao-pergunta h2 {
    font-size: 21px;
    line-height: 1.5;
    margin: 20px 0 25px;
}

.opcao {
    width: 100%;
    text-align: left;
    padding: 16px;
    background: #293548;
    color: white;
    border: 1px solid #475569;
    border-radius: 12px;
    margin-bottom: 12px;
    font-size: 14px;
}

.opcao:disabled {
    opacity: 1;
}

.opcao.correta {
    background: #14532D;
    border-color: #22C55E;
}

.opcao.errada {
    background: #7F1D1D;
    border-color: #EF4444;
}

.feedback {
    background: #1E293B;
    padding: 17px;
    border-radius: 12px;
    margin: 18px 0;
    font-size: 13px;
    line-height: 1.6;
}

.feedback strong {
    display: block;
    margin-bottom: 7px;
}

.pontuacao {
    text-align: center;
    margin-top: 25px;
    color: #94A3B8;
}

.pontuacao strong {
    color: #FACC15;
}

/* RESULTADO */

.resultado-box {
    text-align: center;
    padding-top: 50px;
}

.trofeu {
    font-size: 75px;
    margin-bottom: 20px;
}

.resultado-box h1 {
    font-size: 27px;
    margin-bottom: 12px;
}

.resultado-box p {
    color: #94A3B8;
    line-height: 1.6;
}

.resultado-pontos {
    margin: 35px 0;
    font-size: 55px;
    color: #FACC15;
    font-weight: bold;
}

.resultado-pontos small {
    font-size: 16px;
}

#estatistica {
    margin-bottom: 30px;
}

@media (max-width: 360px) {
    .hero h1 {
        font-size: 28px;
    }

    .cartao-pergunta h2 {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">🇲🇿</div>
    <div>
        <h2>Quiz-CH Moçambique</h2>
        <p>Conhece a nossa história</p>
    </div>
</header>

<!-- INÍCIO -->

<section id="inicio">

    <div class="hero">

        <span class="badge">DESAFIO HISTÓRICO</span>

        <h1>Quanto sabes sobre Moçambique?</h1>

        <p>
            Testa os teus conhecimentos sobre a história
            do nosso país e descobre até onde vai a tua sabedoria.
        </p>

        <div class="recorde">
            <span>🏆 Teu recorde</span>
            <strong id="recorde">0 pontos</strong>
        </div>

        <label for="categoria">Escolhe uma categoria</label>

        <select id="categoria">
            <option value="Todas">Todas as categorias</option>
            <option value="Independência">Independência</option>
            <option value="Colonização">Colonização</option>
            <option value="Libertação">Luta de Libertação</option>
            <option value="Personalidades">Personalidades</option>
            <option value="História">História geral</option>
        </select>

        <button onclick="iniciarJogo()" class="btn-principal">
            Começar jogo →
        </button>

    </div>

</section>


<!-- JOGO -->

<section id="jogo" class="escondido">

    <div class="info-jogo">
        <span id="numero">Pergunta 1/10</span>
        <span class="tempo">⏱ <strong id="timer">20</strong>s</span>
    </div>

    <div class="progresso">
        <div id="barra"></div>
    </div>

    <div class="cartao-pergunta">

        <span class="categoria-tag" id="categoria-pergunta"></span>

        <h2 id="pergunta"></h2>

        <div id="alternativas"></div>

    </div>

    <div id="feedback" class="feedback escondido"></div>

    <button id="btn-proximo"
            class="btn-principal escondido"
            onclick="proximaPergunta()">
        Próxima pergunta →
    </button>

    <div class="pontuacao">
        Pontuação: <strong id="pontos">0</strong>
    </div>

</section>


<!-- RESULTADO -->

<section id="resultado" class="escondido">

    <div class="resultado-box">

        <div class="trofeu">🏆</div>

        <h1>Desafio concluído!</h1>

        <p id="mensagem-final"></p>

        <div class="resultado-pontos">
            <span id="pontuacao-final">0</span>
            <small>pontos</small>
        </div>

        <p id="estatistica"></p>

        <button onclick="voltarInicio()" class="btn-principal">
            Jogar novamente
        </button>

    </div>

</section>

</div>


<script>

// BANCO DE PERGUNTAS

const perguntas = [

{
categoria:"Independência",
pergunta:"Em que data Moçambique conquistou a independência?",
opcoes:["25 de Junho de 1975","7 de Setembro de 1974","25 de Setembro de 1964","4 de Outubro de 1992"],
resposta:0,
explicacao:"Moçambique tornou-se independente em 25 de Junho de 1975."
},

{
categoria:"Libertação",
pergunta:"Qual organização liderou a luta de libertação nacional?",
opcoes:["RENAMO","FRELIMO","MPLA","UNITA"],
resposta:1,
explicacao:"A FRELIMO liderou a luta armada pela independência de Moçambique."
},

{
categoria:"Personalidades",
pergunta:"Quem foi o primeiro Presidente de Moçambique independente?",
opcoes:["Joaquim Chissano","Eduardo Mondlane","Samora Machel","Armando Guebuza"],
resposta:2,
explicacao:"Samora Moisés Machel foi o primeiro Presidente de Moçambique independente."
},

{
categoria:"Libertação",
pergunta:"Em que ano começou a luta armada de libertação nacional?",
opcoes:["1960","1962","1964","1970"],
resposta:2,
explicacao:"A luta armada começou em 25 de Setembro de 1964, em Chai, Cabo Delgado."
},

{
categoria:"Colonização",
pergunta:"Qual navegador português chegou à costa de Moçambique em 1498?",
opcoes:["Pedro Álvares Cabral","Vasco da Gama","Bartolomeu Dias","Fernão de Magalhães"],
resposta:1,
explicacao:"Vasco da Gama chegou à costa de Moçambique em 1498, durante a viagem para a Índia."
},

{
categoria:"Personalidades",
pergunta:"Quem foi o primeiro presidente da FRELIMO?",
opcoes:["Samora Machel","Joaquim Chissano","Eduardo Mondlane","Marcelino dos Santos"],
resposta:2,
explicacao:"Eduardo Mondlane foi o primeiro presidente da FRELIMO."
},

{
categoria:"Independência",
pergunta:"Qual acordo abriu caminho para a independência de Moçambique?",
opcoes:["Acordo de Lusaka","Acordo de Roma","Tratado de Berlim","Acordo de Nkomati"],
resposta:0,
explicacao:"O Acordo de Lusaka foi assinado em 7 de Setembro de 1974 entre Portugal e a FRELIMO."
},

{
categoria:"História",
pergunta:"Qual cidade foi a capital de Moçambique antes de Lourenço Marques?",
opcoes:["Beira","Quelimane","Ilha de Moçambique","Nampula"],
resposta:2,
explicacao:"A Ilha de Moçambique foi a capital até à transferência da capital para Lourenço Marques, em 1898."
},

{
categoria:"História",
pergunta:"Em que ano foi assinado o Acordo Geral de Paz que pôs fim à guerra civil?",
opcoes:["1985","1990","1992","1994"],
resposta:2,
explicacao:"O Acordo Geral de Paz foi assinado em Roma, a 4 de Outubro de 1992."
},

{
categoria:"Personalidades",
pergunta:"Em que ano morreu Eduardo Mondlane?",
opcoes:["1965","1969","1974","1975"],
resposta:1,
explicacao:"Eduardo Mondlane foi assassinado em Dar es Salaam, na Tanzânia, em 3 de Fevereiro de 1969."
},

{
categoria:"História",
pergunta:"Qual era o nome colonial da atual cidade de Maputo?",
opcoes:["Lourenço Marques","Porto Amélia","António Enes","Vila Pery"],
resposta:0,
explicacao:"A atual cidade de Maputo era conhecida como Lourenço Marques durante o período colonial."
},

{
categoria:"História",
pergunta:"Qual império histórico teve grande influência na região do atual centro de Moçambique?",
opcoes:["Império Romano","Império de Gaza","Império Monomotapa","Império Otomano"],
resposta:2,
explicacao:"O Império Monomotapa teve grande influência política e comercial na região do atual centro de Moçambique e áreas vizinhas."
}

];


// VARIÁVEIS

let listaPerguntas = [];
let indice = 0;
let pontos = 0;
let tempo = 20;
let intervalo;
let respondido = false;

let recorde = Number(localStorage.getItem("recordeQuiz")) || 0;

document.getElementById("recorde").textContent = recorde + " pontos";


// INICIAR JOGO

function iniciarJogo() {

    const categoria = document.getElementById("categoria").value;

    listaPerguntas = perguntas.filter(p =>
        categoria === "Todas" || p.categoria === categoria
    );

    listaPerguntas.sort(() => Math.random() - 0.5);

    indice = 0;
    pontos = 0;

    document.getElementById("inicio").classList.add("escondido");
    document.getElementById("resultado").classList.add("escondido");
    document.getElementById("jogo").classList.remove("escondido");

    mostrarPergunta();
}


// MOSTRAR PERGUNTA

function mostrarPergunta() {

    respondido = false;
    tempo = 20;

    clearInterval(intervalo);

    const atual = listaPerguntas[indice];

    document.getElementById("numero").textContent =
        `Pergunta ${indice + 1}/${listaPerguntas.length}`;

    document.getElementById("timer").textContent = tempo;

    document.getElementById("categoria-pergunta").textContent = atual.categoria;

    document.getElementById("pergunta").textContent = atual.pergunta;

    document.getElementById("pontos").textContent = pontos;

    document.getElementById("barra").style.width =
        ((indice / listaPerguntas.length) * 100) + "%";

    document.getElementById("feedback").classList.add("escondido");

    document.getElementById("btn-proximo").classList.add("escondido");

    const alternativas = document.getElementById("alternativas");

    alternativas.innerHTML = "";

    atual.opcoes.forEach((opcao, i) => {

        const botao = document.createElement("button");

        botao.className = "opcao";

        botao.textContent = String.fromCharCode(65 + i) + "  " + opcao;

        botao.onclick = () => verificarResposta(i);

        alternativas.appendChild(botao);

    });

    iniciarTemporizador();
}


// TEMPORIZADOR

function iniciarTemporizador() {

    intervalo = setInterval(() => {

        tempo--;

        document.getElementById("timer").textContent = tempo;

        if (tempo <= 0) {
            clearInterval(intervalo);
            verificarResposta(-1);
        }

    }, 1000);
}


// VERIFICAR RESPOSTA

function verificarResposta(escolha) {

    if (respondido) return;

    respondido = true;

    clearInterval(intervalo);

    const atual = listaPerguntas[indice];

    const botoes = document.querySelectorAll(".opcao");

    botoes.forEach((botao, i) => {

        botao.disabled = true;

        if (i === atual.resposta) {
            botao.classList.add("correta");
        }

        if (i === escolha && escolha !== atual.resposta) {
            botao.classList.add("errada");
        }

    });

    const feedback = document.getElementById("feedback");

    feedback.classList.remove("escondido");

    if (escolha === atual.resposta) {

        pontos += 10;

        document.getElementById("pontos").textContent = pontos;

        feedback.innerHTML = `
            <strong style="color:#22C55E">✓ Resposta correta!</strong>
            ${atual.explicacao}
        `;

    } else {

        feedback.innerHTML = `
            <strong style="color:#EF4444">✕ Resposta incorreta!</strong>
            ${escolha === -1 ? "O tempo terminou. " : ""}
            ${atual.explicacao}
        `;

    }

    document.getElementById("btn-proximo").classList.remove("escondido");

    document.getElementById("btn-proximo").textContent =
        indice === listaPerguntas.length - 1
        ? "Ver resultado →"
        : "Próxima pergunta →";

}


// PRÓXIMA PERGUNTA

function proximaPergunta() {

    indice++;

    if (indice < listaPerguntas.length) {
        mostrarPergunta();
    } else {
        finalizarJogo();
    }

}


// FINALIZAR JOGO

function finalizarJogo() {

    clearInterval(intervalo);

    document.getElementById("jogo").classList.add("escondido");

    document.getElementById("resultado").classList.remove("escondido");

    document.getElementById("pontuacao-final").textContent = pontos;

    const total = listaPerguntas.length * 10;

    const percentagem = Math.round((pontos / total) * 100);

    document.getElementById("estatistica").textContent =
        `Acertaste ${pontos / 10} de ${listaPerguntas.length} perguntas (${percentagem}%).`;

    let mensagem = "";

    if (percentagem === 100) {
        mensagem = "Excelente! És um verdadeiro conhecedor da história de Moçambique!";
    } else if (percentagem >= 70) {
        mensagem = "Muito bom! Conheces bastante sobre a nossa história.";
    } else if (percentagem >= 40) {
        mensagem = "Bom esforço! Ainda podes melhorar os teus conhecimentos.";
    } else {
        mensagem = "Continua a estudar a história do nosso país. Podes melhorar!";
    }

    document.getElementById("mensagem-final").textContent = mensagem;

    if (pontos > recorde) {
        recorde = pontos;
        localStorage.setItem("recordeQuiz", recorde);
    }

}


// VOLTAR AO INÍCIO

function voltarInicio() {

    document.getElementById("resultado").classList.add("escondido");

    document.getElementById("inicio").classList.remove("escondido");

    document.getElementById("recorde").textContent =
        recorde + " pontos";

}

</script>

</body>
</html>
